# ===================================
# DATABASE CONFIGURATION
# ===================================
# Uses environment variables with local defaults
# Override with .env file for local development
# Override with platform dashboard for production (Render)
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:seat_booking_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&usePublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}


# Connection pool settings for better concurrency
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ===================================
# REDIS CACHE CONFIGURATION
# ===================================
# Uses environment variables with local defaults
# For Upstash production: Set REDIS_SSL_ENABLED=true in env vars
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=2000ms
spring.data.redis.jedis.pool.max-active=20
spring.data.redis.jedis.pool.max-idle=10
spring.data.redis.jedis.pool.min-idle=5
spring.data.redis.jedis.pool.max-wait=2000ms

# ===================================
# JWT CONFIGURATION
# ===================================
# Uses environment variables
# Local default: development key (change in production!)
# Production: Set strong JWT_SECRET in environment variables
jwt.secret=${JWT_SECRET:dev-secret-key-change-in-production-to-256-bits}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===================================
# ERROR HANDLING
# ===================================
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on-param
server.error.include-exception=false

# ===================================
# SERVER CONFIGURATION
# ===================================
server.port=${SERVER_PORT:8080}

# ===================================
# LOGGING CONFIGURATION
# ===================================
# Development: DEBUG level for debugging
# Production: Change to INFO level (set via environment variable if needed)
logging.level.com.officeseatbooking=DEBUG
logging.level.com.officeseatbooking.controller=INFO
logging.level.com.officeseatbooking.service=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.security=DEBUG
